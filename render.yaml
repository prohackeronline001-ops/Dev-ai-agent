services:
  - type: worker  # ✅ Web Service না, Worker ব্যবহার করুন
    name: jarvis-bot
    runtime: docker
    repo: https://github.com/yourusername/your-repo
    branch: main
    dockerfilePath: ./Dockerfile
    numInstances: 1  # ✅ never scale this above 1 — Telegram polling only allows a single consumer per token
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false   # set the real value in the Render dashboard, never commit it here
      - key: HF_API_TOKEN
        sync: false   # set the real value in the Render dashboard, never commit it here
